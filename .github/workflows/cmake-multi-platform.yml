name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            vcpkg_toolchain: "C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            vcpkg_toolchain: "/usr/local/share/vcpkg/scripts/buildsystems/vcpkg.cmake"
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            vcpkg_toolchain: "/usr/local/share/vcpkg/scripts/buildsystems/vcpkg.cmake"
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # --- НОВЫЙ ШАГ: Автоматическая установка ZLIB перед конфигурацией ---
    - name: Install ZLIB via vcpkg (Windows)
      if: matrix.os == 'windows-latest'
      run: vcpkg install zlib:x64-windows

    - name: Install ZLIB via Apt (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

    # --- Конец новых шагов ---

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=${{ matrix.vcpkg_toolchain }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Upload Windows Build Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-binaries
        path: ${{ steps.strings.outputs.build-output-dir }}/Release/*.exe
